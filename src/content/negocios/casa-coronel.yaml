# de habitaciones por error). Coordenadas obtenidas de un Plus Code
# (FXGV+322 Tecolutla, Veracruz) que Paloma compartió directamente.
# distancias (playa, 2026-08-01): calculada contra la geometría real de
# la línea de costa (OpenStreetMap, natural=coastline) — validado con ~20m
# de margen contra Mandala/Xanath. El negocio mencionó "a 1 cuadra del río
# y de la playa" en servicios, pero esa cercanía parece ser al río, no al
# mar abierto (478m calculado); se deja el texto de servicios sin tocar.
