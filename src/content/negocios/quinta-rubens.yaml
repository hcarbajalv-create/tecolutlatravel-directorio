# BITÁCORA DE ALTA — Quinta Ruben's (1 sep 2026)
#
# NOMBRE: el volante del negocio dice "QUINTA RUBE'S"; Google Maps lo registra
#   como "Quinta Ruben'$". Se publica como "Quinta Ruben's" (sin el signo $, que
#   en web se lee como spam). PENDIENTE: confirmar con el dueño la grafía oficial.
# DATOS CONFIRMADOS por Paloma vía WhatsApp (31 ago 2026) y por el volante del
#   propio negocio: 2 habitaciones dobles + 1 triple, baño privado en cada una,
#   wifi, ventilador, no se aceptan mascotas, agua caliente SOLO en el baño de
#   visitas de la planta baja (se documenta tal cual, sin maquillarlo).
# TELÉFONO: 5652903633, confirmado por Hector y coincide con el volante del
#   negocio. El volante trae un segundo número (5665862437) que NO se publica
#   hasta saber si es de otra persona o para otro uso.
# DIRECCIÓN Y COORDENADAS: tomadas del pin real del negocio en Google Maps
#   (place id 0x85dbb58c18b412b1:0x1c3ecb1c04ac8eda) → "Rosas 189, Fracc. Arcadia,
#   93570 Tecolutla, Ver.", lat 20.4886031 / lng -97.0212403, plus code FXQH+CG.
# DISTANCIA A LA PLAYA: 362 m, medida por Hector con la herramienta "Medir
#   distancia" de Google Maps desde el pin del negocio hasta la orilla del mar
#   (1 sep 2026). OJO: el volante del negocio dice "1 cuadra del mar", lo cual
#   no corresponde; se publica el dato medido, no el del volante.
# CAPACIDAD: confirmada el 1 sep 2026 — las camas son matrimoniales, así que cada
#   habitación doble (2 camas) recibe 4 personas y la triple (3 camas) recibe 6.
#   Total del lugar 14. Como las habitaciones se rentan por separado, va
#   capacidadMaxima: 6 (la unidad reservable más grande) + unidadesEnConjunto: 3 +
#   capacidadGrupoCompleto: 14. La tarjeta del listado muestra 6, no 14, para no
#   dar a entender que es una casa completa.
# PRECIO Y HORARIO: no confirmados por el negocio → fuera.
# DUPLICADOS: revisado. Quinta Ruben's NO aparece en tecolutlaveracruz.mx (251
#   fichas revisadas, slug /hospedaje/quinta-rubens da 404) ni en Facebook
#   indexado. Riesgo de duplicado BAJO. La descripción se escribió desde cero y
#   evita las muletillas de plantilla del competidor.
# FOTOS: 13 imágenes recibidas. Se descartaron: los 2 volantes con texto (por
#   instrucción de Hector, solo sirvieron para extraer datos) y 1 foto movida de
#   la habitación con colchas rosas. Quedan 10 (plan gratuito, tope 12).
#   Orden: cuarto triple → doble → baño → fachada → segunda doble (las 5 primeras
#   son las que deciden la reserva).
# VERIFICADO: false. Nadie del equipo ha estado en sitio todavía.
# ─────────────────────────────────────────────────────────────────────────────

