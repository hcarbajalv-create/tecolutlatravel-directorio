# Alta recibida vía WhatsApp (2026-08-10, contacto de Paloma). Capitán
# Ignacio Jacinto ("el osito bimbo"), opera dos lanchas bajo la misma
# marca "Paseos en Lancha El Osito": "Evelin" y "Los Compadres". Mismo
# teléfono y ubicación para ambas — se hizo una sola ficha con las dos
# lanchas en el nombre, indicación explícita del usuario.
# Teléfono: el usuario dio dos números distintos (uno por WhatsApp, otro
# en el flyer); se confirmó explícitamente que el correcto es el del
# flyer, 766 102 3516.
# Facebook y correo: aparecen cortados en la imagen del flyer
# ("PaseosEnLanchaElOs...", "Ignaciojo...") — no se usaron por no tener
# el dato completo.
# Ubicación: el usuario dio un link de búsqueda de Maps ("embarcadero de
# tecolutla"), no un pin específico — se usó la coordenada del viewport
# de ese enlace.
# Fotos: portada = flyer ilustrado (a petición explícita del usuario,
# misma regla que Lancha Mi Ángel IR para actividades ecoturísticas) +
# 4 fotos reales de las dos lanchas y sus chalecos salvavidas.
# Precios: no se publican por ahora, misma regla que las demás lanchas.
