# Alta del 3 de septiembre de 2026. Datos dictados por Hector.
#
# Las habitaciones están ARRIBA del Restaurante El Manglar, que ya está en el
# directorio. Por eso comparten dirección, coordenadas y teléfono: es el mismo
# domicilio y el mismo negocio familiar, con dos fichas porque son dos
# servicios distintos (comer y dormir).
#
# capacidadMaxima 22 = 3 habitaciones para 4 personas (12) + 2 para 5 (10).
# El desglose va en descripcionHabitaciones, que es donde se explica.
#
# Las distancias se copian de la ficha del restaurante porque es el mismo
# edificio. La de playa (1600 m) no se muestra en la tarjeta: el código
# descarta las de más de 999 m al mar, así que sale la del centro.
#
# El 10% de descuento en el restaurante lo confirmó Hector y es el gancho que
# ningún otro hospedaje del directorio tiene.
