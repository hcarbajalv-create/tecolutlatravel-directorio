# Alta recibida vía /anunciate (Netlify Forms, 2026-08-01, Elodia Trejo
# Nuñez). Descripción corta redactada a partir del desglose de
# habitaciones que mandó tal cual en el formulario (12 habitaciones: 4
# sencillas, 5 dobles, 2 para 5 personas, 1 para 7 personas, capacidad
# total 45 personas — dato dado así por el negocio, no recalculado).
# Coordenadas extraídas del enlace de Google Maps compartido — el enlace
# traía dos pares de coordenadas (una de la calle "Fernando López
# Arias", otra del negocio "Hotel casa el pariente"); se usó la que
# coincide con el centro del mapa al abrir el link.
# distancias (playa, 2026-08-01): calculada contra la geometría real de
# la línea de costa (OpenStreetMap, natural=coastline) — validado con ~20m
# de margen contra los datos ya confirmados de Casa Mandala (247m real vs
# 269m calculado) y Casa Xanath (318m real vs 337m calculado).
