# Alta del 3 de septiembre de 2026. Datos confirmados por Hector: el negocio
# se llama Lancha Josué, el capitán es Manuel, caben 10 personas y sale del
# embarcadero de la calle Emilio Carranza, el mismo de Lancha Santy (de ahí
# se tomaron las coordenadas). Cada lancha del directorio sale de un
# embarcadero distinto, así que ese dato nunca se copia a ciegas.
#
# Los cuatro recorridos son los mismos que ofrecen las demás lanchas.
# El capitán no lleva campo propio: el sitio lo saca de la descripción corta.
