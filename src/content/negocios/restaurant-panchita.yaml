# Alta recibida vía WhatsApp (2026-08-12). Primer negocio de la categoría
# gastronomía en el sitio.
# Ubicación: dirección dada por el negocio ("avenida Carlos Prieto No. 15,
# a orillas del río, frente al Palo Volador"), confirmada contra Google
# Maps ("Carlos Prieto 15, Tecolotitlán, 93570 Tecolutla, Ver.";
# coordenadas del punto !3d!4d del enlace, pin del negocio).
# Teléfono: confirmado directamente por el negocio (2026-08-12). Google
# Maps no lo tenía listado públicamente.
# OJO — hay dos negocios con nombre parecido en tecolutlaveracruz.mx:
# "Restaurant Panchita" (este, misma dirección) y "Restaurant Panchita 2"
# (otro local, Carlos Prieto No. 21). El teléfono 766-846-0519 que
# aparece en algunos directorios es del "2", NO de este negocio — no
# usarlo aquí.
# Verificado contra la competencia (agente verificador-duplicados,
# 2026-08-12): riesgo de contenido duplicado NINGUNO — la ficha del
# competidor no tiene ni un párrafo propio, solo dirección/distancias
# genéricas y reseñas de terceros. Descripción y servicios redactados
# desde cero a partir de las fotos reales del negocio (platillos y
# ambiente), no copiados de ningún lado.
# Distancias: la del río va PRIMERO (es el gancho real del negocio — está
# literalmente sobre el río, junto al embarcadero — más que la playa,
# que ni se ve desde ahí). La regla de orden vive en content.config.ts:
# la primera entrada de "distancias" es la que se muestra en la tarjeta.
# Playa calculada con la costa real (Overpass API), no estimada — 527 m.
# Capacidad y horario: pendientes a petición explícita del usuario
# (2026-08-12) — Google Maps no publica un horario semanal confiable
# (solo el estado "abierto ahora" del momento de la consulta), así que
# no se agregó para no publicar un dato no confirmado. Mismo criterio
# para rangoPrecios y formasPago: Google Maps sí muestra "$200-300 por
# persona" pero es un estimado de la comunidad, no del negocio — no se
# usa hasta que el negocio lo confirme directamente.
# especialidades (2026-08-12): se separaron los platillos de los
# servicios/amenidades reales (eran cosas distintas mezcladas en la
# misma lista). tipoCocina "Mariscos" es una categorización directa de
# los platillos ya confirmados, no un dato nuevo.
