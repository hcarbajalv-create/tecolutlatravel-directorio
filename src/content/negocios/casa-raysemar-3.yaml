# DECISIÓN DE CATEGORÍA (19 de agosto de 2026): las 4 casas del lote se
# publican en la categoría/filtro "casas" (tipo: casa) pero con la
# etiqueta visible "Departamento" (subtipo), porque en realidad son 4
# unidades independientes en un mismo lote/entrada — más honesto que
