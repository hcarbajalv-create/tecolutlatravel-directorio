fechaActualizacion: 2026-08-19
disponible: true
servicios:
  - 2 camas matrimoniales por recámara
  - Aire acondicionado
  - Ventilador de techo
  - Agua caliente
  - Cocina equipada
  - Sala con TV
  - Comedor
  - Wifi
checkIn: "13:00"
checkOut: "11:00"
tipo: casa
subtipo: Departamentos
numeroHabitaciones: 2
capacidadMaxima: 8
unidadesEnConjunto: 4
capacidadGrupoCompleto: 32
# La insignia de la tarjeta rota entre estos datos en vez de mostrar
# solo "Hasta 32 personas" fijo — evita confundir a quien busca un
# departamento para pocas personas y no entiende de dónde sale el 32.
# El primero ("Hasta 32") sale solo de capacidadGrupoCompleto; estos dos
# son el resto de la rotación.
insigniasExtra:
  - "👥 8 personas c/u"
  - "🚫 No se aceptan mascotas"
wifi: true
petFriendly: false
verificado: false
resenas: [] # Sin reseñas reales todavía — no inventar
destacado: false
