# Alta recibida vía /anunciate (Netlify Forms, 2026-08-02, María Fernanda
# Durán). descripcionCorta tomada tal cual del campo del formulario
# (corrigiendo la errata "prqueña" → "pequeña"), con la cercanía al
# centro y al río agregada del campo "Comentarios adicionales".
# Coordenadas: el enlace de Maps que mandaron apunta al pin genérico de
# "Playa Tecolutla" (no a la dirección real) — probablemente compartieron
# el pin equivocado desde el celular. Como dirección solo dieron "Calle
# Emilio Carranza sin número" (sin número exacto), se usa el punto de esa
# misma calle en Google Maps — confirmada como la misma calle donde está
# Habitaciones Mary (Av. Emilio Carranza 5, a solo ~40m de este punto).
# Pendiente: pedirle a la dueña un pin exacto para afinar la ubicación.
# distancias (playa): se reutiliza el valor ya validado de Habitaciones
# Mary (310m) por estar a ~40m de ese punto — diferencia despreciable a
# esta escala.
