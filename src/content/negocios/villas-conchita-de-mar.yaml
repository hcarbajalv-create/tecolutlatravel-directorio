# Alta recibida vía /anunciate (Netlify Forms, 2026-07-30, Julia Carro).
# Dirección tomada del nombre oficial en el enlace de Google Maps que envió
# ("Paseo de las Jacarandas", más preciso que "Calle Jacarandas"). Coordenadas
# extraídas directo de ese mismo enlace. Sin número de habitaciones: el
# formulario lo dejó vacío (son "dos villas", no se puede resumir en un solo
# número sin preguntar) — no inventar.
# distancias (playa, 2026-08-01): calculada contra la geometría real de
# la línea de costa (OpenStreetMap, natural=coastline), no un solo punto de
# playa — validado con ~20m de margen contra los datos ya confirmados de
# Casa Mandala (247m real vs 269m calculado) y Casa Xanath (318m real vs
# 337m calculado).
